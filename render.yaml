services:
  - type: web
    name: ai-tts-studio
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python combined_app.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID          # bir yoki bir nechta Telegram ID (vergul bilan)
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://tts-uzbek.onrender.com
      - key: BOT_USERNAME
        value: Uzbekcha_tts_bot
