function applyI18n(){
  $$("[data-i18n]").forEach(el=>{const k=el.getAttribute("data-i18n");const v=t(k);if(v)el.textContent=v});
  $$("[data-i18n-placeholder]").forEach(el=>{const k=el.getAttribute("data-i18n-placeholder");const v=t(k);if(v)el.placeholder=v});
  updateCharCount();
}
function setLang(lang){
  currentLang=lang;
  $$(".lang-btn").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
  applyI18n();
  localStorage.setItem("utts_lang",lang);
}

function setTheme(theme){
  document.documentElement.setAttribute("data-theme",theme);
  localStorage.setItem("utts_theme",theme);
  $("#themeMenu").style.display="none";
}
$("#themeBtn").addEventListener("click",e=>{
  const menu=$("#themeMenu"),rect=e.currentTarget.getBoundingClientRect();
  if(menu.style.display==="none"){menu.style.display="block";menu.style.top=(rect.bottom+4)+"px";menu.style.right=(window.innerWidth-rect.right)+"px"}
  else menu.style.display="none";
});
$$("[data-theme]").forEach(b=>b.addEventListener("click",()=>setTheme(b.dataset.theme)));
document.addEventListener("click",e=>{if(!e.target.closest("#themeMenu")&&!e.target.closest("#themeBtn"))$("#themeMenu").style.display="none"});

$$(".lang-btn").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));

function updateCharCount(){
  const txt=textInput.value,chars=txt.length,words=txt.trim()?txt.trim().split(/\s+/).length:0;
  charCount.textContent=`${chars} ${t("charUnit")} · ${words} ${t("wordUnit")}`;
}
textInput.addEventListener("input",()=>{updateCharCount();localStorage.setItem("utts_text",textInput.value)});
speedRange.addEventListener("input",()=>{speedVal.textContent=parseFloat(speedRange.value).toFixed(1)+"x";localStorage.setItem("utts_speed",speedRange.value)});
pitchRange.addEventListener("input",()=>{pitchVal.textContent=parseFloat(pitchRange.value).toFixed(2);localStorage.setItem("utts_pitch",pitchRange.value)});

$("#sampleBtn").addEventListener("click",()=>{
  const voiceId=voiceSelect.value,lang=voiceId?detectVoiceLang(voiceId):"uz";
  textInput.value=SAMPLES[lang]||SAMPLES.uz;updateCharCount();localStorage.setItem("utts_text",textInput.value);
});
$("#clearTextBtn").addEventListener("click",()=>{textInput.value="";updateCharCount();localStorage.removeItem("utts_text")});
$("#clearAllBtn").addEventListener("click",()=>{
  if(currentAudio){currentAudio.pause();currentAudio=null;currentPlayingId=null}
  files=[];renderFiles();clearIDB();toast(t("cleared"),"success");
});

function detectVoiceLang(vid){
  if(!vid)return"uz";
  const v=vid.toLowerCase();
  if(v.includes("sardor")||v.includes("madina")||v.includes("dilfuza")||v.includes("islom"))return"uz";
  if(v.includes("boris")||v.includes("natasha")||v.includes("sergey"))return"ru";
  if(v.includes("john")||v.includes("emily")||v.includes("michael"))return"en";
  if(v.includes("mehmet")||v.includes("elif"))return"tr";
  if(v.includes("aizhan")||v.includes("nurlan"))return"kk";
  return"uz";
}

async function loadVoices(){
  try{
    const res=await fetch("/api/voices");
    if(!res.ok)throw new Error("Failed to load voices");
    const data=await res.json();
    voiceSelect.innerHTML="";
    const groups={};
    (data.voices||data||[]).forEach(v=>{
      const lang=v.language||v.lang||"other";
      if(!groups[lang])groups[lang]=[];
      groups[lang].push(v);
    });
    const langNames={uz:"O'zbekcha",ru:"Русский",en:"English",tr:"Türkçe",kk:"Қазақша"};
    Object.keys(groups).forEach(lang=>{
      const og=document.createElement("optgroup");
      og.label=langNames[lang]||lang;
      groups[lang].forEach(v=>{
        const opt=document.createElement("option");
        opt.value=v.id||v.name;
        opt.textContent=(v.name||v.id)+(v.gender?" ("+v.gender+")":"");
        og.appendChild(opt);
      });
      voiceSelect.appendChild(og);
    });
    const saved=localStorage.getItem("utts_voice");
    if(saved&&voiceSelect.querySelector(`option[value="${saved}"]`))voiceSelect.value=saved;
  }catch(e){
    voiceSelect.innerHTML='<option value="Sardor">Sardor (erkak)</option><option value="Madina">Madina (ayol)</option>';
  }
}
voiceSelect.addEventListener("change",()=>localStorage.setItem("utts_voice",voiceSelect.value));
styleSelect.addEventListener("change",()=>localStorage.setItem("utts_style",styleSelect.value));

function splitText(text,maxLen=2500){
  const chunks=[];let remaining=text.trim();
  while(remaining.length>0){
    if(remaining.length<=maxLen){chunks.push(remaining);break}
    let idx=remaining.lastIndexOf(".",maxLen);
    if(idx<maxLen*0.3)idx=remaining.lastIndexOf(" ",maxLen);
    if(idx<maxLen*0.3)idx=maxLen;
    chunks.push(remaining.slice(0,idx+1).trim());
    remaining=remaining.slice(idx+1).trim();
  }
  return chunks;
}

async function generate(){
  const text=textInput.value.trim();
  if(!text){toast(t("noText"),"error");return}
  const voice=voiceSelect.value,style=styleSelect.value,speed=parseFloat(speedRange.value),pitch=parseFloat(pitchRange.value);
  const chunks=splitText(text);
  abortController=new AbortController;
  genBtn.disabled=true;
  genBtn.innerHTML=`<div class="spinner"></div><span>${t("generating")}</span> <button style="margin-left:8px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.2);color:#fff;font-size:.75rem" id="cancelBtn">${t("cancel")}</button>`;
  const cancelBtn=$("#cancelBtn");
  if(cancelBtn)cancelBtn.addEventListener("click",()=>{if(abortController)abortController.abort()});

  try{
    const blobs=[];
    for(const chunk of chunks){
      const res=await fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:chunk,voice,style,speed,pitch}),signal:abortController.signal});
      if(res.status===429){toast(t("rateLimited"),"error");return}
      if(!res.ok)throw new Error(`HTTP ${res.status}`);
      blobs.push(await res.blob());
    }
    const combined=new Blob(blobs,{type:"audio/mpeg"});
    const url=URL.createObjectURL(combined);
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const now=new Date;
    const name=`${t("filePre")}_${voice}_${now.getHours().toString().padStart(2,"0")}${now.getMinutes().toString().padStart(2,"0")}${now.getSeconds().toString().padStart(2,"0")}`;
    const file={id,name,url,blob:combined,size:combined.size,date:now.toISOString(),voice,style};
    files.unshift(file);
    renderFiles();
    saveToIDB(file);
    toast("✓ "+name,"success");
  }catch(e){
    if(e.name==="AbortError")toast(t("cancel"),"");
    else toast(t("errorGen")+": "+e.message,"error");
  }finally{
    abortController=null;
    genBtn.disabled=false;
    genBtn.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polygon points="5,3 19,12 5,21"/></svg><span data-i18n="generate">${t("generate")}</span>`;
  }
}

genBtn.addEventListener("click",generate);
document.addEventListener("keydown",e=>{if(e.ctrlKey&&e.key==="Enter"){e.preventDefault();generate()}});

function formatSize(bytes){if(bytes<1024)return bytes+" B";if(bytes<1048576)return(bytes/1024).toFixed(1)+" KB";return(bytes/1048576).toFixed(1)+" MB"}
function formatDuration(s){const m=Math.floor(s/60),sec=Math.floor(s%60);return m+":"+sec.toString().padStart(2,"0")}

function renderFiles(){
  const items=filesList.querySelectorAll(".file-item");items.forEach(i=>i.remove());
  emptyState.style.display=files.length?"none":"flex";
  files.forEach(f=>{
    const div=document.createElement("div");div.className="file-item";div.dataset.id=f.id;
    div.innerHTML=`
      <div class="file-top">
        <button class="play-btn" data-id="${f.id}"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg></button>
        <div class="file-info"><div class="file-name">${f.name}.mp3</div><div class="file-detail">${formatSize(f.size)} · ${f.voice}</div></div>
        <div class="file-actions">
          <button title="Download" data-action="download" data-id="${f.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
          <button title="Copy link" data-action="copy" data-id="${f.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button>
          <button title="Delete" data-action="delete" data-id="${f.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>
        </div>
      </div>
      <div class="progress-bar" data-id="${f.id}"><div class="progress-fill"></div></div>`;
    filesList.insertBefore(div,emptyState);
  });
}

filesList.addEventListener("click",e=>{
  const btn=e.target.closest("[data-action]");
  const playBtn=e.target.closest(".play-btn");
  const progBar=e.target.closest(".progress-bar");
  if(btn){
    const action=btn.dataset.action,id=btn.dataset.id,file=files.find(f=>f.id===id);if(!file)return;
    if(action==="download"){
      const a=document.createElement("a");a.href=file.url;a.download=file.name+".mp3";a.click();toast(t("downloaded"),"success");
    }else if(action==="copy"){
      const link=window.location.origin+"/?q="+encodeURIComponent(textInput.value.slice(0,100));
      navigator.clipboard.writeText(link).then(()=>toast(t("copied"),"success")).catch(()=>toast("Copy failed","error"));
    }else if(action==="delete"){
      if(currentPlayingId===id&&currentAudio){currentAudio.pause();currentAudio=null;currentPlayingId=null}
      files=files.filter(f=>f.id!==id);renderFiles();deleteFromIDB(id);toast(t("deleted"),"");
    }
  }else if(playBtn){
    togglePlay(playBtn.dataset.id);
  }else if(progBar){
    seekAudio(progBar,e);
  }
});

function togglePlay(id){
  const file=files.find(f=>f.id===id);if(!file)return;
  if(currentPlayingId===id&&currentAudio){
    if(currentAudio.paused){currentAudio.play()}else{currentAudio.pause()}
    return;
  }
  if(currentAudio){currentAudio.pause();updatePlayBtn(currentPlayingId,false)}
  currentAudio=new Audio(file.url);currentPlayingId=id;
  currentAudio.play();updatePlayBtn(id,true);
  currentAudio.addEventListener("timeupdate",()=>{
    const item=filesList.querySelector(`.file-item[data-id="${id}"]`);if(!item)return;
    const fill=item.querySelector(".progress-fill");
    if(currentAudio.duration)fill.style.width=(currentAudio.currentTime/currentAudio.duration*100)+"%";
    const detail=item.querySelector(".file-detail");
    detail.textContent=`${formatDuration(currentAudio.currentTime)} / ${formatDuration(currentAudio.duration)} · ${file.voice}`;
  });
  currentAudio.addEventListener("ended",()=>{updatePlayBtn(id,false);const item=filesList.querySelector(`.file-item[data-id="${id}"]`);if(item)item.querySelector(".progress-fill").style.width="0"});
  currentAudio.addEventListener("pause",()=>updatePlayBtn(id,false));
  currentAudio.addEventListener("play",()=>updatePlayBtn(id,true));
}

function updatePlayBtn(id,playing){
  const btn=filesList.querySelector(`.play-btn[data-id="${id}"]`);if(!btn)return;
  btn.innerHTML=playing?'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>';
}

function seekAudio(bar,e){
  if(!currentAudio||!currentAudio.duration)return;
  const rect=bar.getBoundingClientRect(),ratio=(e.clientX-rect.left)/rect.width;
  currentAudio.currentTime=ratio*currentAudio.duration;
}

function toast(msg,type){
  const el=document.createElement("div");el.className="toast"+(type?" "+type:"");el.textContent=msg;
  $("#toasts").appendChild(el);setTimeout(()=>el.remove(),3000);
}

function openIDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open("uzbekcha_tts",1);
    req.onupgradeneeded=()=>req.result.createObjectStore("files",{keyPath:"id"});
    req.onsuccess=()=>{db=req.result;resolve(db)};
    req.onerror=()=>reject(req.error);
  });
}
async function saveToIDB(file){
  if(!db)await openIDB();
  const tx=db.transaction("files","readwrite");
  tx.objectStore("files").put({id:file.id,name:file.name,blob:file.blob,size:file.size,date:file.date,voice:file.voice,style:file.style});
}
async function deleteFromIDB(id){
  if(!db)await openIDB();
  db.transaction("files","readwrite").objectStore("files").delete(id);
}
async function clearIDB(){
  if(!db)await openIDB();
  db.transaction("files","readwrite").objectStore("files").clear();
}
async function loadFromIDB(){
  if(!db)await openIDB();
  return new Promise(resolve=>{
    const tx=db.transaction("files","readonly"),store=tx.objectStore("files"),req=store.getAll();
    req.onsuccess=()=>{
      const loaded=(req.result||[]).map(r=>({...r,url:URL.createObjectURL(r.blob)})).sort((a,b)=>new Date(b.date)-new Date(a.date));
      resolve(loaded);
    };
    req.onerror=()=>resolve([]);
  });
}

async function init(){
  const savedTheme=localStorage.getItem("utts_theme");if(savedTheme&&THEMES.includes(savedTheme))setTheme(savedTheme);
  const savedLang=localStorage.getItem("utts_lang");if(savedLang)setLang(savedLang);else applyI18n();
  const savedText=localStorage.getItem("utts_text");if(savedText)textInput.value=savedText;
  const savedSpeed=localStorage.getItem("utts_speed");if(savedSpeed){speedRange.value=savedSpeed;speedVal.textContent=parseFloat(savedSpeed).toFixed(1)+"x"}
  const savedPitch=localStorage.getItem("utts_pitch");if(savedPitch){pitchRange.value=savedPitch;pitchVal.textContent=parseFloat(savedPitch).toFixed(2)}
  const savedStyle=localStorage.getItem("utts_style");if(savedStyle)styleSelect.value=savedStyle;
  updateCharCount();
  loadVoices().then(()=>{const sv=localStorage.getItem("utts_voice");if(sv&&voiceSelect.querySelector(`option[value="${sv}"]`))voiceSelect.value=sv});
  try{files=await loadFromIDB();renderFiles()}catch(e){}
}
init();
})();
</script>
